# OpenAI plugin manifest: skill → MCP dependency declarations.
#
# Every skill in this plugin reaches Descript through the same hosted MCP
# server, authenticated with OAuth. OpenAI reads this file to know which MCP
# server each skill depends on, so the skills stay portable and do not rely on
# the Cursor rule (rules/descript-workflows.mdc) or the root AGENTS.md being
# loaded.

mcp_servers:
  descript:
    type: streamable-http
    url: https://api.descript.com/v2/mcp
    auth: oauth

skills:
  - name: create-video
    path: skills/create-video/SKILL.md
    mcp_servers: [descript]
  - name: edit-project
    path: skills/edit-project/SKILL.md
    mcp_servers: [descript]
  - name: publish-project
    path: skills/publish-project/SKILL.md
    mcp_servers: [descript]
  - name: export-transcript
    path: skills/export-transcript/SKILL.md
    mcp_servers: [descript]
  - name: export-timeline
    path: skills/export-timeline/SKILL.md
    mcp_servers: [descript]
